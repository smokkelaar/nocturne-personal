{{- if include "nocturne.removedToggleOn" .Values.web.autoscaling }}
{{- fail "web.autoscaling has been removed: set web.replicaCount instead (see the chart README, \"Web replicas\")." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nocturne.web.fullname" . }}
  labels:
    {{- include "nocturne.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels: {{- include "nocturne.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nocturne.web.selectorLabels" . | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nocturne.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "nocturne.web.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Dockerfile.web (the published image) doesn't declare a non-root
          # USER; provide one explicitly so it satisfies pod-level
          # runAsNonRoot. Users can override via containerSecurityContext.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.web.containerPort | quote }}
            - name: NOCTURNE_API_URL
              value: {{ include "nocturne.api.internalUrl" . | quote }}
            {{- if .Values.baseDomain }}
            - name: BASE_DOMAIN
              value: {{ .Values.baseDomain | quote }}
            {{- end }}
            {{- with .Values.web.allowedFrameAncestors }}
            - name: ALLOWED_FRAME_ANCESTORS
              value: {{ . | quote }}
            {{- end }}
            - name: INSTANCE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nocturne.instanceKeySecretName" . }}
                  key: {{ include "nocturne.instanceKeySecretKey" . }}
            # The web image's entrypoint composes NOCTURNE_POSTGRES_URI from these
            # nocturne_web role pieces. The chart can't render the password secret, so
            # the URI is assembled at container start, not in the template.
            - name: WEB_DB_HOST
              value: {{ include "nocturne.db.host" . | quote }}
            - name: WEB_DB_PORT
              value: {{ include "nocturne.db.port" . | quote }}
            - name: WEB_DB_NAME
              value: {{ include "nocturne.db.database" . | quote }}
            - name: WEB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nocturne.db.passwordSecret" (dict "ctx" . "role" "web") }}
                  key: {{ include "nocturne.db.passwordKey" (dict "ctx" . "role" "web") }}
            {{- include "nocturne.observability.web.env" . | nindent 12 }}
          # No documented HTTP health endpoint on the web container in v0; using TCP probe.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
