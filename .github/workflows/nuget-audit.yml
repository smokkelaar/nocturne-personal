name: NuGet audit

# Advisories are published after a pull request's audit passed; this catches them on main weekly.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NuGetAuditAsErrors: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet
      # The same project set the Tests workflow builds: every test project and, through them, the
      # API, connectors and AppHost. nocturne.sln's Windows-only projects do not restore here.
      - name: Restore with advisories as errors
        run: |
          set -euo pipefail
          sln="$GITHUB_WORKSPACE/audit.slnx"
          # `dotnet sln add` also adds referenced source projects on the .NET 11
          # runner, then fails when another test references the same project.
          python3 - "$sln" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          solution = ET.Element('Solution')
          for group in ('Unit', 'Integration', 'Parity'):
              folder = ET.SubElement(solution, 'Folder', Name=f'/{group}/')
              projects = sorted(Path('tests', group).glob('*/*.csproj'))
              if not projects:
                  raise SystemExit(f'No {group} test projects found')
              for project in projects:
                  ET.SubElement(folder, 'Project', Path=project.as_posix())
          ET.indent(solution)
          ET.ElementTree(solution).write(sys.argv[1], encoding='unicode')
          PY
          dotnet restore "$sln"
