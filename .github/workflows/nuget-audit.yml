name: NuGet audit

# Audit the deployed Personal source weekly. The old main tree is retained for feature PRs,
# while Personal follows the Nightscout base used by Home Assistant.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NuGetAuditAsErrors: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: personal
      - uses: ./.github/actions/setup-dotnet
      # The same project set the Tests workflow builds: every test project and, through them, the
      # API, connectors and AppHost. nocturne.sln's Windows-only projects do not restore here.
      - name: Restore with advisories as errors
        run: |
          set -euo pipefail
          sln="$GITHUB_WORKSPACE/audit.slnx"
          python3 scripts/create_test_solution.py "$sln" \
            tests/Unit/*/*.csproj tests/Integration/*/*.csproj tests/Parity/*/*.csproj
          dotnet restore "$sln"
